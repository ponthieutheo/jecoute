[package]
name = "verify-updater-sig"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vérifie latest.json et les signatures d'une release de J’écoute comme le fera l'app installée."
license = "MIT"

# Mêmes crates (et mêmes versions majeures) que tauri-plugin-updater 2.x, pour lire le manifeste et
# vérifier les signatures exactement comme l'app installée le fera.
[dependencies]
base64 = "0.22"
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
url = { version = "2", features = ["serde"] }

# Outil isolé : ne pas le rattacher à un éventuel workspace parent.
[workspace]
